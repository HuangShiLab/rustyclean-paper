[package]
name = "rustyclean-x"
version = "0.1.0"
edition = "2021"
description = "Calibrated dual-evidence host depletion prototype combining gapped-seed and minimizer evidence"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Intentionally dependency-light in the framework draft. Production will add
# flate2/zstd, memmap2, crossbeam-channel, clap, rayon and index-specific crates.

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
