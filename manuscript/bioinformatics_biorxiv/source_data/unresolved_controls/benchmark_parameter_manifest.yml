manifest_version: 2026-10-03
rustyclean:
  production_commit: 55f93af
  research_source_commit: 7ab1a4b
  executable_version: 0.1.0
equal_thread_panel:
  scheduler: SLURM
  partition: intel
  exclusive: true
  allocated_cpus: 16
  primary_worker_threads: 16
  runtime_metric: GNU time wall clock; fastp + Hostile arm is the sum of sequential stages
  rustyclean:
    command_flags:
      - --deacon-index panhuman-1.k31w15.idx
      - --host-index human-t2t-hla
      - --max-contamination 100.0
      - --fastp-compression 1
      - --deacon-compression-level 2
      - --clean
      - -t 16
  fastp:
    version: 1.0.1
    command_flags:
      - --thread 16
      - --compression 1
      - --cut_front
      - --cut_tail
      - --qualified_quality_phred 20
      - --length_required 50
  hostile:
    version: 2.0.2
    command_flags:
      - --aligner bowtie2
      - --index human-t2t-hla
      - --airplane
      - --force
      - --threads 16
  bowtie2_version: 2.5.5
  samtools_version: 1.24
cleanifier_panel:
  version: 1.3.2
  worker_threads: 16
  compression_threads: 2
  compression: gz
  compression_level: 1
  threshold: 0.5
threshold_sweep:
  thresholds: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.50, 0.60, 0.80, 1.01]
  accuracy_observations_per_threshold_and_dataset: 1
  runtime_status: exploratory
validation:
  contamination_metric: removed_host_reads / (removed_host_reads + retained_reads) * 100
  default_or_benchmark_setting:
    max_contamination_percent: 100.0
    effect: rejection disabled in benchmarked AUTO commands
  minimum_output_size_bytes: 1024
  paired_bowtie2_retention: fragments retained only when both mates are unmapped (SAM flag 12 after Bowtie2)
historical_main_panel:
  status: descriptive historical comparison, not primary controlled benchmark
  threads:
    rustyclean_deacon: 16
    kneaddata_hostile: 8
  provenance_warnings:
    hostile_5M_to_60M_accuracy: hostile_raw arm
    hostile_5M_to_60M_runtime: separate fastp + Hostile timing
    kneaddata_100M_counts: not archived
    hostile_100M_counts: not archived
additional_versions:
  deacon: 0.17.0
  rustyclean_executable: 0.1.0
  hostile_equal_thread: 2.0.2
  bowtie2_equal_thread: 2.5.5
  samtools_equal_thread: 1.24
  kneaddata_historical_main_panel: 0.12.3
  insilicoseq_main_simulated_panel: 2.0.0
  python_statistics: 3.12.12
  scipy_statistics: 1.18.0
indexes:
  rustyclean_tier1_human: panhuman-1 pangenome index
  rustyclean_bowtie2_verification: human-t2t-hla
  hostile_equal_thread: human-t2t-hla
  kneaddata_historical_main_panel: hg39_T2T GCF_009914755.1 without HLA
